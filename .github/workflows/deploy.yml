name: "Build & Deploy to Google Cloud Run"

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "data_pipeline/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: us-east1
  ARTIFACT_REPO: us-east1-docker.pkg.dev/fpl-league-dashboard-prod/fpl-images

jobs:
  build-and-deploy:
    name: "Build, Push & Deploy Services"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Authenticate to Google Cloud via WIF"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: "Set up Google Cloud SDK"
        uses: google-github-actions/setup-gcloud@v2

      - name: "Configure Docker for Artifact Registry"
        run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------------------
      # 1. Build & Deploy Backend API Service
      # ------------------------------------------------------------------------
      - name: "Build & Push Backend Container"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.ARTIFACT_REPO }}/fpl-backend:${{ github.sha }},${{ env.ARTIFACT_REPO }}/fpl-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Deploy Backend to Cloud Run"
        run: |
          gcloud run services update fpl-backend \
            --image=${{ env.ARTIFACT_REPO }}/fpl-backend:${{ github.sha }} \
            --port=8000 \
            --region=${{ env.REGION }} \
            --quiet

      # ------------------------------------------------------------------------
      # 2. Build & Deploy Data Pipeline Job
      # ------------------------------------------------------------------------
      - name: "Build & Push Data Pipeline Container"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: data_pipeline/Dockerfile
          push: true
          tags: ${{ env.ARTIFACT_REPO }}/fpl-pipeline:${{ github.sha }},${{ env.ARTIFACT_REPO }}/fpl-pipeline:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Deploy Data Pipeline Cloud Run Job"
        run: |
          gcloud run jobs update fpl-pipeline-job \
            --image=${{ env.ARTIFACT_REPO }}/fpl-pipeline:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --quiet

      # ------------------------------------------------------------------------
      # 3. Build & Deploy Frontend UI
      # ------------------------------------------------------------------------
      - name: "Build & Push Frontend Container"
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.ARTIFACT_REPO }}/fpl-frontend:${{ github.sha }},${{ env.ARTIFACT_REPO }}/fpl-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Deploy Frontend to Cloud Run"
        run: |
          gcloud run services update fpl-frontend \
            --image=${{ env.ARTIFACT_REPO }}/fpl-frontend:${{ github.sha }} \
            --port=3000 \
            --region=${{ env.REGION }} \
            --quiet
